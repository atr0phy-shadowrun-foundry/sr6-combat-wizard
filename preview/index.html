<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Combat Turn Wizard — preview</title>
    <link rel="stylesheet" href="../styles/wizard.css">
    <style>
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            background: #1b1b1f;
            color: #eee;
            font-family: "Segoe UI", sans-serif;
        }
        .preview-layout {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            height: 100%;
            overflow: hidden;
        }
        .preview-rail {
            min-height: 0;
            overflow: auto;
            padding: 1rem;
            background: #141418;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }
        .preview-rail h1 {
            font-size: 1rem;
            margin: 0 0 0.4rem;
        }
        .preview-rail p {
            color: #c9c3b6;
            font-size: 0.82rem;
            line-height: 1.4;
        }
        .preview-rail button {
            display: block;
            width: 100%;
            text-align: left;
            margin: 0.25rem 0;
            padding: 0.35rem 0.5rem;
            color: inherit;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            cursor: pointer;
        }
        .preview-rail button.current {
            border-color: #7f9cb8;
        }
        .preview-stage {
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 0.75rem;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }
        .preview-window {
            width: min(780px, 100%);
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #2a2a2e;
            color: #eee;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 6px;
            overflow: hidden;
            --color-text-secondary: #c9c3b6;
            --color-border-light-tertiary: rgba(255, 255, 255, 0.18);
        }
        .preview-window-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.7rem;
            background: #1c1c20;
            font-weight: 600;
        }
        .preview-window .window-content {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .preview-toast {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            max-width: 320px;
            padding: 0.6rem 0.8rem;
            background: #243024;
            border: 1px solid #6a9a72;
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .preview-toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="preview-layout">
        <aside class="preview-rail">
            <h1>Wizard preview</h1>
            <p>Same layout and words as the Foundry window. Clicks stay in this file. Adding an item here only turns the page, the way the sheet would after the item exists.</p>
            <div id="rail"></div>
        </aside>
        <main class="preview-stage">
            <div class="preview-window sr6-turn-wizard">
                <div class="preview-window-header"><span>↗</span> <span id="window-title">Turn — Krait</span></div>
                <div class="window-content">
                    <div id="app"></div>
                </div>
            </div>
        </main>
    </div>
    <div id="toast" class="preview-toast"></div>
    <script>

            ["home", "Start"],
            ["my-turn", "It's my turn"],
            ["my-turn-major", "The main action"],

            ["attack", "Attack"],
            ["weapons", "Firearms on the sheet"],
            ["fire-mode", "Ares Alpha, fire mode"],
            ["confirm", "Open the attack roll"],
            ["launcher", "After the launcher is added"],
            ["grenade", "Grenade ammunition"],
            ["thrown", "After the thrown copy is added"],
            ["search", "Compendium search"],

        const pages = {

                    {

                            ["Attack", "A weapon, a fist, a thrown weapon, a grenade.", "attack", "Major"],
                            ["Cast a spell", "Combat spells and everything else on the spell list.", "home", "Major"],
                            ["Defend or get clear", "Minor actions, Full Defense, and the Edge actions that ride on them.", "defend"],
                            ["Move, aim, cover, reload", "Minor actions, major actions, and Fire from Cover.", "position"],
                            ["Spend Edge", "Boosts and Edge actions, including the ones the dialog leaves out.", "home"],
                            ["Other magic", "Adept powers, spirits, a focus, astral perception.", "home"],
                            ["Matrix, a complex form, or a drone", "Matrix actions from the system list, plus forms on the sheet.", "home"],
                            ["Something else", "A skill, teamwork, first aid, a grapple, an off-hand penalty.", "home"],
                        ],

                ],
                blocks: [{
                    tone: "rules",
                    heading: "How a round is built",
                    cite: "Core p. 40",
                    paragraphs: [
                        "Everyone acts once. You start with 1 major action and 1 minor action, plus 1 extra minor for each initiative die, and you do not start with more than 5 minor actions.",
                        "A major action may be spent as a minor. Four minor actions may be spent as one major. Unused actions do not carry into the next round.",
                        "Minor actions are usually automatic. An attack, a spell, and most other majors roll.",
                    ],
                }],
                footnote: "",
            }),
            "my-turn": page({
                kicker: "Your turn",
                title: "A minor, if you want one",
                notice: "You can skip this. The next step is the attack or the spell.",
                crumb: ["It's my turn"],
                choices: [
                    ["Move", "10 meters, once.", "my-turn-major", "Minor"],
                    ["Take Aim", "+1 die on the attack that follows.", "my-turn-major", "Minor"],

                    ["Drop Prone", "Go prone without the dive bonus.", "my-turn-major", "Minor"],

                ],
            }),
            "my-turn-major": page({
                kicker: "Your turn",
                title: "The main action",

                crumb: ["It's my turn", "The main action"],
                choices: [
                    ["Attack", "A weapon, a fist, a thrown weapon, a grenade.", "attack", "Major"],
                    ["Cast a spell", "A formula on the sheet.", "home", "Major"],
                    ["Sprint", "15 meters plus hits, instead of a normal move.", "my-turn-after", "Major"],
                    ["Something else", "Reload, a skill, or another major.", "home"],

            "my-turn-after": page({
                kicker: "Your turn",

            }),

                    ["Full Defense", "Add Willpower to every Defense test this round.", "incoming-do", "Major"],
                    ["Hit the Dirt", "Prone, +2 Defense, then −2 on your tests.", "incoming-do", "Minor"],

            }),
            "incoming-do": page({
                kicker: "Defense",
                title: "Dodge",
                crumb: ["Someone is attacking me", "Dodge"],
                steps: [
                    "Open the attack card in chat.",
                    "Press Defense.",
                    "Type 4 into the modifier. That is Athletics.",
                ],
                choices: [
                    ["Mark the minor", "Count it on the tally at the top.", "incoming-do", ""],
                ],
            }),
            defend: page({
                kicker: "Defense",
                title: "Defend or get clear",
                lead: "The real Defense roll is the button on the attack card. This page is sorted by what the action costs. You can take an anytime action when it is not your turn, if you still have it.",
                crumb: ["Defend or get clear"],
                groups: [
                    {
                        heading: "Minor action",
                        note: "Anytime. One Defense test, unless the action says otherwise.",
                        choices: [
                            ["Dodge", "Add Athletics to one Defense test.", "home", "Minor"],
                            ["Block", "Add Close Combat to one melee Defense test.", "home", "Minor"],
                            ["Hit the Dirt", "Prone, +2 Defense, then −2 on your tests.", "home", "Minor"],
                            ["Avoid Incoming", "Leave a blast or a gas cloud.", "home", "Minor"],
                        ],
                    },
                    {
                        heading: "Major action",
                        note: "Anytime. This spends the major for the round.",
                        choices: [
                            ["Full Defense", "Add Willpower to every Defense test this round.", "home", "Major"],
                        ],
                    },
                    {
                        heading: "Minor action and a major action",
                        note: "The minor is Intercept. The major is the melee attack.",
                        choices: [
                            ["Intercept", "Melee attack when someone enters Close.", "home", "Minor + Major"],
                        ],
                    },
                    {
                        heading: "Edge action",
                        note: "An Edge action does not spend a minor or a major. It attaches to the action in the hint.",
                        choices: [
                            ["Tactical Roll", "1 Edge. Rides on Hit the Dirt.", "home", "1 Edge"],
                            ["Wrest", "2 Edge. Replaces Block.", "home", "2 Edge"],
                        ],
                    },
                ],
            }),
            position: page({
                kicker: "Set up the turn",
                title: "Move, aim, cover, reload",
                lead: "Sorted by what the action costs. A minor on your turn is not the same list as a minor you can take when it is not your turn.",
                crumb: ["Move, aim, cover, reload"],
                groups: [
                    {
                        heading: "Minor action",
                        note: "On your turn.",
                        choices: [
                            ["Move", "10 meters, once.", "home", "Minor"],
                            ["Take Aim", "+1 die, stacks to Willpower.", "home", "Minor"],
                            ["Take Cover", "Cover I–IV on the token.", "home", "Minor"],
                            ["Drop Prone", "Prone without the dive bonus.", "home", "Minor"],
                            ["Stand Up", "Clear prone.", "home", "Minor"],
                            ["Quick Draw", "A small weapon, with the attack.", "home", "Minor"],
                            ["Reload a smartgun", "The next clip is in hand.", "home", "Minor"],
                        ],
                    },
                    {
                        heading: "Major action",
                        note: "On your turn.",
                        choices: [
                            ["Sprint", "15 meters plus hits.", "home", "Major"],
                            ["Ready Weapon", "Draw or stow.", "home", "Major"],
                            ["Pick up or put down", "The careful version of drop.", "home", "Major"],
                            ["Reload a weapon", "Anything other than a smartgun reload.", "home", "Major"],
                        ],
                    },
                    {
                        heading: "Minor action, anytime",
                        note: "You can take this when it is not your turn, if you still have the minor.",
                        choices: [
                            ["Drop Object", "Let go of what you are holding.", "home", "Minor"],
                        ],
                    },
                    {
                        heading: "Edge action",
                        note: "This does not spend a minor or a major. It attaches to the ranged attack.",
                        choices: [
                            ["Fire from Cover", "2 Edge. Shoot from Cover IV without the minor to lean out.", "home", "2 Edge"],
                        ],
                    },
                ],
            }),
            attack: page({
                kicker: "Attack · major · your turn",
                title: "How are you attacking?",
                lead: "One attack is one major action. Called shots, multiple attacks, and aim are minors that ride along with it. You will get those on the last page.",
                crumb: ["Attack"],
                choices: [
                    ["Melee", "Close combat, unarmed, a cyber weapon.", "weapons", "2"],
                    ["Firearm", "A gun on the sheet. The next page is the fire mode.", "weapons", "2"],
                    ["Thrown or a bow", "Athletics weapons, including a grenade entered as a thrown weapon.", "weapons", "Empty"],
                    ["Grenade, rocket, or explosive", "Ammunition items. These do not open an attack roll.", "grenade", "1"],
                    ["Launcher, spray, or exotic", "Special weapons and Exotic Weapons.", "weapons", "Empty"],
                    ["Gunnery", "A vehicle-mounted weapon, Engineering + Logic.", "weapons", "Empty"],
                ],
            }),
            weapons: page({
                kicker: "Attack",
                title: "Firearm",
                lead: "Every firearm on the sheet. Eden has no in-hand flag, so a stowed gun is in this list too.",
                crumb: ["Attack", "Firearm"],
                groups: [
                    {
                        choices: [
                            ["Ares Alpha", "Firearms · rifles · DV 4P · Semi, Burst, Auto", "fire-mode", "Semi, Burst, Auto"],
                            ["Ares Predator VI", "Firearms · pistols · DV 3P · Semi", "fire-mode", "Semi"],
                        ],
                    },
                    {
                        heading: "Compendium",
                        choices: [
                            ["Look up a weapon", "Weapons compendium in shadowrun-data.", "search"],
                        ],
                    },
                ],
            }),
            "fire-mode": page({
                kicker: "Ares Alpha",
                title: "Which fire mode?",
                lead: "Eden reads the mode boxes on the weapon. The attack dialog starts on the mode you pick here.",
                crumb: ["Attack", "Firearm", "Ares Alpha"],
                groups: [
                    {
                        choices: [
                            ["Semi-automatic", "2 rounds. Attack Rating −2. Damage +1. This is the double tap.", "confirm"],
                            ["Burst, narrow", "4 rounds into one target. Attack Rating −4. Damage +2.", "confirm"],
                            ["Burst, wide", "4 rounds across two targets. Attack Rating −2. Damage +1. Target exactly two tokens.", "confirm"],
                            ["Full auto", "10 rounds. Attack Rating −6 before the radius penalty. Next page picks the radius.", "confirm"],
                        ],
                    },
                    {
                        heading: "Second weapon",
                        note: "Eden keeps one fire-mode list on this gun. Add the launcher or shotgun as its own gear item, then attack with that item.",
                        choices: [
                            ["Add Ares Alpha Grenade Launcher", "Exotic Weapons. Damage is the grenade. This adds the launcher, then opens its attack.", "launcher", "Add", "Ares Alpha Grenade Launcher was added to Krait."],
                        ],
                    },
                    {
                        heading: "Compendium",
                        choices: [
                            ["Look up a weapon mod", "Smartgun, underbarrel, and other mods in shadowrun-data.", "search"],
                        ],
                    },
                ],
                blocks: [{
                    tone: "rules",
                    heading: "What the dialog will apply",
                    cite: "Core p. 108",
                    paragraphs: [
                        "Single shot is 1 round and does not change Attack Rating or damage.",
                        "Semi-automatic in this dialog is 2 rounds, Attack Rating −2, damage +1.",
                        "Narrow burst is 4 rounds, Attack Rating −4, damage +2. Wide burst wants exactly two targets.",
                        "Full auto is 10 rounds and Attack Rating −6, then another −2 per meter of radius after the first.",
                    ],
                }],
            }),
            confirm: page({
                kicker: "Ares Alpha",
                title: "Attack with Ares Alpha",
                lead: "Semi-automatic. Two rounds, Attack Rating −2, damage +1.",
                notice: "Leave the fire mode in the dialog. Changing it throws away this choice.",
                crumb: ["Attack", "Ares Alpha", "Semi-automatic"],
                launch: "Open the attack roll",
            }),
            launcher: page({
                kicker: "Ares Alpha Grenade Launcher",
                title: "Which fire mode?",
                lead: "The launcher is now its own gear item. Single shot is the only mode stored on it. Damage is still the grenade you load.",
                crumb: ["Attack", "Ares Alpha Grenade Launcher"],
                choices: [
                    ["Single shot", "1 round. Attack Rating unchanged. Damage unchanged.", "launcher"],
                ],
                blocks: [
                    {
                        tone: "eden",
                        heading: "On the Eden sheet",
                        paragraphs: ["This item was created because the rifle's modifier list only names the launcher. It does not give the rifle a second fire-mode row."],
                    },
                    {
                        tone: "gap",
                        heading: "What you still settle at the table",
                        paragraphs: ["The grenade's blast, gas, or scatter is on printed pp. 114–117. Eden will not place a template or soak each person in the area."],
                    },
                ],
                launch: "Open the attack roll",
            }),
            grenade: page({
                kicker: "Grenade",
                title: "Fragmentation Grenade",
                lead: "The sheet can count ammunition. It cannot throw it until a thrown weapon exists.",
                crumb: ["Attack", "Grenade"],
                choices: [
                    ["Add Fragmentation Grenade as a thrown weapon", "Athletics. Attack Rating starts blank. Blast stays a table call.", "thrown", "Add", "Fragmentation Grenade was added to Krait as a thrown weapon."],
                    ["Roll Athletics (Throwing) anyway", "The dice only. Damage stays manual.", "thrown"],
                ],
                blocks: [
                    {
                        tone: "rules",
                        heading: "Throwing and blast",
                        cite: "Core p. 114",
                        paragraphs: ["Throwing uses Athletics. The blast, gas, or scatter that follows is on printed pp. 114–117."],
                    },
                    {
                        tone: "gap",
                        heading: "What you still settle at the table",
                        paragraphs: ["The new item does not know the blast radius. Apply that, and any scatter, in chat."],
                    },
                ],
            }),
            thrown: page({
                kicker: "Fragmentation Grenade",
                title: "Attack with Fragmentation Grenade",
                lead: "No fire mode was picked. Melee and mode-less weapons open straight into the attack dialog.",
                crumb: ["Attack", "Fragmentation Grenade"],
                blocks: [
                    {
                        tone: "rules",
                        heading: "Five steps",
                        cite: "Core p. 104",
                        paragraphs: ["The attack pool is Athletics + Agility. Net hits add to the damage. Soak is the next card."],
                    },
                    {
                        tone: "gap",
                        heading: "What you still settle at the table",
                        paragraphs: ["Attack Rating on this new item is blank. Set the five range boxes from the grenade line if you want the dialog to compare them. Blast is still by hand."],
                    },
                ],
                launch: "Open the attack roll",
            }),
            search: page({
                kicker: "Weapons",
                title: "Compendium",
                lead: "Adding an entry copies it onto the acting character. Dragging from the compendium browser onto the sheet does the same thing.",
                crumb: ["Attack", "Compendium"],
                search: "ares",
                groups: [{
                    choices: [
                        ["Ares Alpha", "firearms · DV 4", "fire-mode", "Add"],
                        ["Ares Predator VI", "firearms · DV 3", "weapons", "Add"],
                        ["Armtech Mgl6", "exotic weapons · DV 0", "launcher", "Add"],
                    ],
                }],
                blocks: [{
                    tone: "eden",
                    heading: "Search",
                    paragraphs: ["Type at least two letters, then Search. Open compendium shows the whole pack in Foundry's browser. This preview already shows a sample result list."],
                }],
            }),
        };

        function page(spec) {
            return spec;
        }

        const CITE = {
            "It's my turn": "Core p. 40",
            "Someone is attacking me": "Core p. 42",
            "Attack": "Core p. 40",
            "Cast a spell": "Core p. 130",
            "Defend or get clear": "Core p. 42",
            "Move, aim, cover, reload": "Core p. 41",
            "Spend Edge": "Core p. 46",
            "Other magic": "Core p. 127",
            "Matrix, a complex form, or a drone": "Core p. 174",
            "Something else": "Core p. 43",
            "Move": "Core p. 41",
            "Take Aim": "Core p. 41",
            "Take Cover": "Core p. 41",
            "Drop Prone": "Core p. 41",
            "Stand Up": "Core p. 41",
            "Quick Draw": "Core p. 41",
            "Reload a smartgun": "Core p. 43",
            "Sprint": "Core p. 42",
            "Ready Weapon": "Core p. 43",
            "Pick up or put down": "Core p. 43",
            "Reload a weapon": "Core p. 43",
            "Drop Object": "Core p. 41",
            "Drop what you're holding": "Core p. 41",
            "Fire from Cover": "Core p. 47",
            "Dodge": "Core p. 42",
            "Block": "Core p. 42",
            "Hit the Dirt": "Core p. 42",
            "Avoid Incoming": "Core p. 43",
            "Full Defense": "Core p. 42",
            "Intercept": "Core p. 43",
            "Tactical Roll": "Core p. 47",
            "Wrest": "Core p. 47",
            "Melee": "Core p. 104",
            "Firearm": "Core p. 108",
            "Thrown or a bow": "Core p. 114",
            "Grenade, rocket, or explosive": "Core p. 114",
            "Launcher, spray, or exotic": "Core p. 108",
            "Gunnery": "Core p. 104",
            "Semi-automatic": "Core p. 108",
            "Burst, narrow": "Core p. 108",
            "Burst, wide": "Core p. 108",
            "Full auto": "Core p. 108",
            "Single shot": "Core p. 108",
            "Ares Alpha": "Core p. 108",
            "Ares Predator VI": "Core p. 108",
            "Add Ares Alpha Grenade Launcher": "Core p. 114",
            "Add Fragmentation Grenade as a thrown weapon": "Core p. 114",
            "Roll Athletics (Throwing) anyway": "Core p. 114",
        };
        const LEAD_CITE = {
            defend: "Core p. 42",
            position: "Core p. 41",
            attack: "Core p. 40",
            weapons: "Core p. 108",
            "fire-mode": "Core p. 108",
            confirm: "Core p. 108",
            grenade: "Core p. 114",
            thrown: "Core p. 114",
        };

        const history = [];
        let current = "home";
        let major = 0;
        let minor = 1;

        function choiceButton(entry) {
            const [label, hint, go, badge, toast] = entry;
            const badgeHtml = badge ? `<span class="sr6tw-badge">${badge}</span>` : "";
            const toastAttr = toast ? ` data-toast="${escapeAttr(toast)}"` : "";
            const cite = CITE[label] || "";
            const citeHtml = cite ? `<button type="button">${cite}</button>` : "";
            return `<div class="sr6tw-choice-row">
                <button type="button" class="sr6tw-choice" data-go="${go}"${toastAttr}>
                    <span class="sr6tw-choice-copy">
                        <span class="sr6tw-choice-label">${label}</span>
                        ${hint ? `<span class="sr6tw-choice-hint">${hint}</span>` : ""}
                    </span>
                    ${badgeHtml}
                </button>
                ${hint ? `<span class="sr6tw-help rules"><button type="button" class="sr6tw-help-btn" aria-label="${escapeAttr(label)}">?</button><span class="sr6tw-tip" role="tooltip"><p>${hint}</p>${citeHtml}</span></span>` : ""}
            </div>`;
        }

        function render(id, push = true) {
            if (push && current !== id) history.push(current);
            current = id;
            const spec = pages[id];
            const groups = spec.groups || (spec.choices ? [{ choices: spec.choices }] : []);
            const groupHtml = groups.map((group) => `
                <section class="sr6tw-group">
                    ${group.heading ? `<h3>${group.heading}</h3>` : ""}
                    <div class="sr6tw-choices">${group.choices.map(choiceButton).join("")}</div>
                </section>`).join("");
            const helps = [
                ...(spec.lead ? [{ tone: "rules", heading: "", paragraphs: [spec.lead], cite: LEAD_CITE[id] || "" }] : []),
                ...(spec.blocks || []),
            ].map((block) => `
                <span class="sr6tw-help ${block.tone}">
                    <button type="button" class="sr6tw-help-btn" aria-label="${block.heading || "This step"}">?</button>
                    <span class="sr6tw-tip" role="tooltip">
                        ${block.heading ? `<strong>${block.heading}</strong>` : ""}
                        ${block.paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}
                        ${(block.cite || (block.tone === "rules" ? LEAD_CITE[id] : "")) ? `<button type="button">${block.cite || LEAD_CITE[id]}</button>` : ""}
                    </span>
                </span>`).join("");
            const search = spec.search != null ? `
                <div class="sr6tw-search">
                    <input type="search" value="${spec.search}" placeholder="Search weapons">
                    <button type="button">Search</button>
                    <button type="button">Open compendium</button>
                </div>` : "";
            const crumb = history.map((id, index) =>
                `<button type="button" data-action="crumb" data-index="${index}">${pages[id]?.title || id}</button>`
            ).join("");
            document.getElementById("app").innerHTML = `
                <div class="sr6tw">
                    <header class="sr6tw-bar">
                        <div class="sr6tw-bar-row">
                            <div class="sr6tw-who"><span class="sr6tw-who-label">Acting</span> <strong>Krait</strong></div>
                            <div class="sr6tw-tally">
                                <span class="sr6tw-tally-item ${major > 1 ? "over" : ""}">
                                    <span>Major ${major}/1</span>
                                    <button type="button" data-tally="major" data-delta="1">+</button>
                                    <button type="button" data-tally="major" data-delta="-1">−</button>
                                </span>
                                <span class="sr6tw-tally-item ${minor > 3 ? "over" : ""}">
                                    <span>Minor ${minor}/3</span>
                                    <button type="button" data-tally="minor" data-delta="1">+</button>
                                    <button type="button" data-tally="minor" data-delta="-1">−</button>
                                </span>
                            </div>
                        </div>
                        <div class="sr6tw-actors">
                            <button type="button" class="sr6tw-chip current">Krait</button>
                            <button type="button" class="sr6tw-chip">Rigger drone</button>
                        </div>
                        ${crumb ? `<div class="sr6tw-crumb">${crumb}<span>${spec.title}</span></div>` : ""}
                    </header>
                    <div class="sr6tw-scroll">
                        <p class="sr6tw-kicker">${spec.kicker || ""}</p>
                        <div class="sr6tw-title-row">
                            <h2>${spec.title}</h2>
                            ${helps}
                        </div>
                        ${spec.notice ? `<p class="sr6tw-notice">${spec.notice}</p>` : ""}
                        ${spec.steps ? `<ol class="sr6tw-steps">${spec.steps.map((step) => `<li>${step}</li>`).join("")}</ol>` : ""}
                        ${search}
                        <p class="sr6tw-targets">Targeted: Halloweener
                            <button type="button" data-action="refresh">Refresh</button>
                        </p>
                        ${groupHtml}
                    </div>
                    <footer class="sr6tw-foot">
                        <button type="button" data-action="back" ${history.length ? "" : "disabled"}>Back</button>
                        <button type="button" data-action="home">Start</button>
                        ${spec.launch ? `<button type="button" class="sr6tw-launch">${spec.launch}</button>` : ""}
                    </footer>
                </div>`;
            document.getElementById("rail").innerHTML = screens.map(([key, label]) =>
                `<button type="button" data-screen="${key}" class="${key === current ? "current" : ""}">${label}</button>`
            ).join("");
        }

        function escapeAttr(value) {
            return String(value).replace(/"/g, "&quot;");
        }

        function toast(message) {
            const node = document.getElementById("toast");
            node.textContent = message;
            node.classList.add("show");
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => node.classList.remove("show"), 2400);
        }

        document.body.addEventListener("click", (event) => {
            const tally = event.target.closest("[data-tally]");
            if (tally) {
                if (tally.dataset.tally === "major") major = Math.max(0, major + Number(tally.dataset.delta));
                else minor = Math.max(0, minor + Number(tally.dataset.delta));
                render(current, false);
                return;
            }
            const screen = event.target.closest("[data-screen]");
            if (screen) {
                render(screen.dataset.screen);
                return;
            }
            const go = event.target.closest("[data-go]");
            if (go) {
                if (go.dataset.toast) toast(go.dataset.toast);
                render(go.dataset.go);
                return;
            }
            const action = event.target.closest("[data-action]");
            if (!action) return;
            if (action.dataset.action === "home") render("home");
            if (action.dataset.action === "back" && history.length) render(history.pop(), false);
            if (action.dataset.action === "crumb") {
                const index = Number(action.dataset.index);
                const id = history[index];
                if (id) {
                    history.length = index;
                    render(id, false);
                }
            }
            if (action.dataset.action === "refresh") toast("In Foundry this rereads targeted tokens.");
        });

        render("home", false);
    </script>
</body>
</html>
